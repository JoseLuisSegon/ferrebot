<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">FerreBot - Clavos sin medida</title>
  <desc id="desc">A conceptual Spanish information card showing a vague hardware order, the unresolved nail size and package, and the human clarification question required before confirmation.</desc>
  <rect width="1080" height="1350" fill="#F8F4EC"/>
  <rect width="1080" height="26" fill="#0A4F50"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="76" y="82" width="66" height="66" rx="16" fill="#0A4F50"/>
    <g stroke="#FFFFFF" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M90 106l19-11 19 11v22l-19 11-19-11z"/>
      <path d="M90 106l19 11 19-11M109 117v22"/>
    </g>
    <text x="161" y="129" fill="#0A4F50" font-size="43" font-weight="700" letter-spacing="-2">FerreBot</text>
    <rect x="778" y="91" rx="16" width="229" height="42" fill="#E9F1ED"/>
    <text x="891" y="118" text-anchor="middle" fill="#0A4F50" font-size="19" font-weight="700" letter-spacing="1">EJEMPLO FICTICIO</text>
    <text x="77" y="255" fill="#0A4F50" font-size="75" font-weight="700" letter-spacing="-3">¿Clavos sin</text>
    <text x="77" y="337" fill="#0A4F50" font-size="75" font-weight="700" letter-spacing="-3">medida?</text>
    <text x="80" y="399" fill="#435A58" font-size="31">No confirmes un SKU por adivinación.</text>
    <rect x="77" y="470" width="926" height="192" rx="24" fill="#FFFFFF" stroke="#D6E4DF" stroke-width="3"/>
    <circle cx="129" cy="523" r="22" fill="#DCF0E9"/>
    <path d="M119 523h20M129 513v20" stroke="#0A4F50" stroke-width="4" stroke-linecap="round"/>
    <text x="172" y="532" fill="#607572" font-size="22" font-weight="700" letter-spacing="1.2">PEDIDO DE EJEMPLO</text>
    <text x="117" y="591" fill="#223635" font-size="36" font-weight="600">“Mándame 2 bultos de</text>
    <text x="117" y="630" fill="#223635" font-size="36" font-weight="600">cemento y clavos.”</text>
    <rect x="77" y="704" width="926" height="201" rx="24" fill="#FFF2D7" stroke="#E8A332" stroke-width="3"/>
    <path d="M120 762l22-39 22 39z" fill="none" stroke="#9D6116" stroke-width="5" stroke-linejoin="round"/>
    <path d="M142 738v10M142 755v1" stroke="#9D6116" stroke-width="4" stroke-linecap="round"/>
    <text x="189" y="765" fill="#744D15" font-size="34" font-weight="700">INFORMACIÓN PENDIENTE</text>
    <text x="119" y="821" fill="#744D15" font-size="30">Faltan la medida y la presentación</text>
    <text x="119" y="860" fill="#744D15" font-size="30">del clavo (caja, pieza u otra).</text>
    <path d="M540 921v36" stroke="#0A4F50" stroke-width="6" stroke-linecap="round"/>
    <path d="M527 946l13 15 13-15" fill="none" stroke="#0A4F50" stroke-width="6" stroke-linecap="round"/>
    <rect x="77" y="978" width="926" height="151" rx="24" fill="#0A4F50"/>
    <text x="117" y="1036" fill="#B6DBD1" font-size="23" font-weight="700" letter-spacing="1.3">LA PREGUNTA ÚTIL</text>
    <text x="117" y="1090" fill="#FFFFFF" font-size="35" font-weight="700">“¿Qué medida y en qué presentación?”</text>
    <text x="79" y="1192" fill="#0A4F50" font-size="27" font-weight="700">Sin respuesta: revisión humana, no confirmación.</text>
    <line x1="78" y1="1233" x2="1002" y2="1233" stroke="#D5E2DD" stroke-width="3"/>
    <text x="79" y="1280" fill="#71827E" font-size="22">Demostración educativa. Sin IA en vivo ni pedidos reales.</text>
  </g>
</svg>
